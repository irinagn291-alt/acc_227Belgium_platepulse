name: PlatePulse
options:
  bundleIdPrefix: com.platepulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: false
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
targets:
  PlatePulse:
    type: application
    platform: iOS
    sources:
      - path: PlatePulse
      - path: Vendor/Then
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.platepulse.pulse
        PRODUCT_NAME: PlatePulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: PlatePulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: PlatePulse reads barcodes so logging never depends on typing.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
    info:
      path: PlatePulse/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: plp_background
          UIImageName: plp_Splash
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: PlatePulse reads barcodes so logging never depends on typing.
        UIUserInterfaceStyle: Dark
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: PlatePulse
        ITSAppUsesNonExemptEncryption: false
  PlatePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlatePulseTests
    dependencies:
      - target: PlatePulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.platepulse.pulse.tests
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PlatePulse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PlatePulse"
schemes:
  PlatePulse:
    build:
      targets:
        PlatePulse: all
        PlatePulseTests: [test]
    test:
      targets:
        - PlatePulseTests
